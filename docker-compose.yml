services:
  app:
    build: .
    container_name: pc_support_backend
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - ./uploads:/app/uploads
      - ./storages:/app/storages
    env_file:
      - .env
    depends_on:
      - db
    command: npm run start:dev

  db:
    image: postgres:18-alpine
    container_name: nest_postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: ${TZ}
      PGTZ: ${PGTZ}
    volumes:
      - pgdata_v2:/var/lib/postgresql

volumes:
  pgdata:
  pgdata_v2: